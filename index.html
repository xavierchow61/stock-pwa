<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="股票投資">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <title>股票投資儀表板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #0f172a; }
    body { display: flex; flex-direction: column; }
    iframe {
      flex: 1; width: 100%; border: 0;
      background: #0f172a;
      /* 處理 iPhone 瀏海/底部安全區 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #loader {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #0f172a; color: #22c55e;
      font-family: -apple-system, sans-serif; font-size: 14px;
      flex-direction: column; gap: 12px; z-index: 9999;
    }
    .spin {
      width: 40px; height: 40px; border: 3px solid #1e293b;
      border-top-color: #22c55e; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader"><div class="spin"></div><div>載入股票儀表板...</div></div>
  <!--
    ⚠ 把下方 GAS_URL 換成你自己的 Apps Script Web App 部署網址
    格式: https://script.google.com/macros/s/AKfycb.../exec
  -->
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbzsmcGuG2DMDOBWm6c3qk54UfXju2F7Qo5tgm8txRjmC_YmJJqZhtgutwOMFnYl2ZfFwA/exec"
    allow="autoplay; clipboard-read; clipboard-write; fullscreen; payment; web-share"
    onload="document.getElementById('loader').style.display='none'"></iframe>

  <script>
    // 註冊 Service Worker (PWA + 離線)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('SW registered', reg.scope))
          .catch(err => console.warn('SW failed', err));
      });
    }
    // iOS 加到主畫面後,避免邊滑邊縮放
    document.addEventListener('gesturestart', e => e.preventDefault());
  </script>
</body>
</html>
