<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="股票投資">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <title>股票投資儀表板</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100vh; height: 100dvh; background: #0f172a;
                 color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 24px; text-align: center; }
    .logo { width: 96px; height: 96px; border-radius: 22px; background: #22c55e;
            display: flex; align-items: center; justify-content: center;
            font-size: 56px; font-weight: 800; color: white;
            margin-bottom: 24px; box-shadow: 0 8px 32px rgba(34,197,94,0.3); }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #22c55e; color: #0f172a; text-decoration: none;
      padding: 14px 32px; border-radius: 14px; font-weight: 700; font-size: 16px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(34,197,94,0.4);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(34,197,94,0.5); }
    .btn:active { transform: translateY(0); }
    .hint { margin-top: 24px; font-size: 12px; color: #64748b; max-width: 320px; line-height: 1.6; }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .countdown { color: #22c55e; font-weight: 700; }
  </style>
</head>
<body>
  <div class="logo">股</div>
  <h1 id="title">股票投資儀表板</h1>
  <p class="sub" id="sub">即將跳轉到應用程式 <span class="countdown" id="cd">2</span> 秒...</p>
  <a class="btn" id="openBtn" href="https://script.google.com/macros/s/AKfycbwSVMPym_qr1CCTMqJ6oGHIlJWTKP4nPTQLztg7OFpJqIe6C6PA0wiIjvkQeT_205r8ZQ/exec">
    <span>立即開啟</span> →
  </a>
  <p class="hint">提示:在 Safari 中加入主畫面後,點擊 icon 即可全螢幕進入</p>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwSVMPym_qr1CCTMqJ6oGHIlJWTKP4nPTQLztg7OFpJqIe6C6PA0wiIjvkQeT_205r8ZQ/exec';
    // 註冊 Service Worker (PWA 必需)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    }
    // 自動倒數跳轉
    let n = 2;
    const cd = document.getElementById('cd');
    const tick = setInterval(() => {
      n--; if (cd) cd.textContent = n;
      if (n <= 0) {
        clearInterval(tick);
        window.location.href = GAS_URL;
      }
    }, 1000);
  </script>
</body>
</html>
